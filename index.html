
<canvas id="c" style="display:block;width:100%;height:520px;cursor:crosshair;border-radius:12px;background:#0b0b0f;"></canvas>
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
  <button onclick="triggerShockwave()" style="font-size:12px;padding:6px 14px;background:#c8ff00;color:#0b0b0f;border:none;border-radius:999px;cursor:pointer;font-weight:600;">Shockwave</button>
  <button onclick="triggerMeteorStorm()" style="font-size:12px;padding:6px 14px;background:#7c5cfc;color:#fff;border:none;border-radius:999px;cursor:pointer;font-weight:600;">Meteor storm</button>
  <button onclick="triggerNova()" style="font-size:12px;padding:6px 14px;background:transparent;color:#c8ff00;border:1px solid #c8ff00;border-radius:999px;cursor:pointer;font-weight:600;">Nova burst</button>
</div>
<script>
(function(){
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const ACCENT  = [200,255,0];
const PURPLE  = [124,92,252];
const CYAN    = [0,220,255];

let W=0,H=0,dpr=1;
let mouse={x:-9999,y:-9999,down:false,vx:0,vy:0,px:-9999,py:-9999};
let t=0;

function resize(){
  dpr=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=Math.round(W*dpr);
  cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function safe(){for(let i=0;i<arguments.length;i++){if(!isFinite(arguments[i])||isNaN(arguments[i]))return false;}return true;}

/* ── STARS ── */
function mkStar(){
  const pick=Math.random();
  const col=pick<0.5?ACCENT:pick<0.8?PURPLE:CYAN;
  return{
    x:Math.random()*W, y:Math.random()*H,
    ox:0,oy:0, vx:(Math.random()-.5)*.22, vy:(Math.random()-.5)*.22,
    r:Math.random()*1.6+.3,
    alpha:Math.random()*.45+.15,
    tp:Math.random()*Math.PI*2, ts:Math.random()*.009+.002,
    col, pulse:Math.random()>.9,
    _rx:0,_ry:0,
  };
}
let stars=[];

/* ── ORBS ── */
function mkOrb(i){
  const cols=[ACCENT,PURPLE,CYAN];
  return{x:Math.random()*W,y:Math.random()*H,r:160+Math.random()*220,
    col:cols[i%3],alpha:.05,speed:.0003+Math.random()*.0004,phase:Math.random()*Math.PI*2};
}
let orbs=[];

/* ── RIPPLES (click) ── */
let ripples=[];
function addRipple(x,y,col,big){
  ripples.push({x,y,r:0,maxR:big?300:120,alpha:big?.8:.55,col:col||ACCENT,speed:big?6:3.5});
}

/* ── SHOCKWAVE ── */
let shockwaves=[];
function triggerShockwave(){
  shockwaves.push({x:W/2,y:H/2,r:0,maxR:Math.max(W,H)*.75,alpha:.9,speed:8});
  /* blast stars outward */
  stars.forEach(s=>{
    const dx=s.x-W/2, dy=s.y-H/2;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=14+Math.random()*8;
    s.ox+=(dx/d)*f; s.oy+=(dy/d)*f;
  });
}

/* ── NOVA ── */
let novas=[];
function triggerNova(){
  const x=mouse.x>0&&mouse.x<W?mouse.x:W/2;
  const y=mouse.y>0&&mouse.y<H?mouse.y:H/2;
  for(let i=0;i<60;i++){
    const a=Math.random()*Math.PI*2;
    const spd=2+Math.random()*5;
    novas.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      r:Math.random()*2+.8,life:0,maxLife:50+Math.random()*40,
      col:Math.random()>.5?ACCENT:CYAN});
  }
  /* attract stars toward nova center */
  stars.forEach(s=>{
    const dx=x-s.x, dy=y-s.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    s.ox+=(dx/d)*4; s.oy+=(dy/d)*4;
  });
}

/* ── METEORS ── */
let meteors=[];
let meteorTimer=0;
function spawnMeteor(fast){
  const sx=Math.random()*W*.7+W*.05;
  const spd=fast?6+Math.random()*4:2.5+Math.random()*2.5;
  meteors.push({x:sx,y:-10,vx:spd*.8,vy:spd,len:80+Math.random()*120,
    life:0,maxLife:50+Math.random()*50,col:Math.random()>.5?ACCENT:CYAN});
}
function triggerMeteorStorm(){
  for(let i=0;i<8;i++) setTimeout(()=>spawnMeteor(true),i*120);
}

/* ── TRAILS (mouse drag) ── */
let trail=[];

/* ── HEX GRID ── */
function drawHex(){
  const sz=52, h=sz*Math.sqrt(3);
  const cols=Math.ceil(W/(sz*1.5))+2, rows=Math.ceil(H/h)+2;
  ctx.save(); ctx.strokeStyle='rgba(200,255,0,0.025)'; ctx.lineWidth=.6;
  for(let row=-1;row<rows;row++){
    for(let col=-1;col<cols;col++){
      const cx=col*sz*1.5, cy=row*h+(col%2===0?0:h/2);
      ctx.beginPath();
      for(let a=0;a<6;a++){
        const ang=(Math.PI/3)*a-Math.PI/6;
        const px=cx+sz*Math.cos(ang), py=cy+sz*Math.sin(ang);
        a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ── WARP LINES (mouse velocity) ── */
let warpLines=[];
function spawnWarpLine(){
  const speed=Math.sqrt(mouse.vx*mouse.vx+mouse.vy*mouse.vy);
  if(speed<3||mouse.x<0||mouse.x>W) return;
  const ang=Math.atan2(mouse.vy,mouse.vx);
  const len=20+speed*8;
  warpLines.push({
    x:mouse.x,y:mouse.y,
    ang, len, alpha:.6, life:0, maxLife:18,
    col:Math.random()>.5?ACCENT:PURPLE
  });
}

function init(){
  resize();
  stars=Array.from({length:130},mkStar);
  orbs=Array.from({length:5},(_,i)=>mkOrb(i));
}

function draw(){
  requestAnimationFrame(draw);
  if(W===0||H===0) return;
  t++;

  /* mouse velocity */
  mouse.vx=(mouse.x-mouse.px)*.5+(mouse.vx*.5);
  mouse.vy=(mouse.y-mouse.py)*.5+(mouse.vy*.5);
  mouse.px=mouse.x; mouse.py=mouse.y;
  if(t%2===0) spawnWarpLine();

  /* background */
  ctx.clearRect(0,0,W,H);
  const hs=Math.sin(t*.003)*.5+.5;
  try{
    const g=ctx.createRadialGradient(W*.5,H*.35,0,W*.5,H*.5,Math.max(W,H)*.8);
    g.addColorStop(0,'rgba('+(14+Math.round(hs*6))+',14,'+(20+Math.round(hs*10))+',1)');
    g.addColorStop(.6,'rgba(11,11,15,1)');
    g.addColorStop(1,'rgba(8,8,12,1)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }catch(e){ctx.fillStyle='#0b0b0f';ctx.fillRect(0,0,W,H);}

  drawHex();

  /* orbs */
  orbs.forEach((o,i)=>{
    o.phase+=o.speed;
    o.x+=Math.sin(o.phase+i)*.35;
    o.y+=Math.cos(o.phase*.7+i*.4)*.28;
    if(o.x<-o.r)o.x=W+o.r; if(o.x>W+o.r)o.x=-o.r;
    if(o.y<-o.r)o.y=H+o.r; if(o.y>H+o.r)o.y=-o.r;
    if(!safe(o.x,o.y)||o.r<=0) return;
    try{
      const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      const c=o.col;
      g.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+o.alpha+')');
      g.addColorStop(.45,'rgba('+c[0]+','+c[1]+','+c[2]+','+(o.alpha*.35)+')');
      g.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
    }catch(e){}
    /* orb drifts slightly toward mouse */
    const dx=mouse.x-o.x, dy=mouse.y-o.y;
    const dd=Math.sqrt(dx*dx+dy*dy);
    if(dd>0&&dd<400){o.x+=dx/dd*.12; o.y+=dy/dd*.12;}
  });

  /* mouse trail */
  if(mouse.down&&mouse.x>0&&mouse.x<W){
    trail.push({x:mouse.x,y:mouse.y,life:0,maxLife:22,col:ACCENT});
  }
  trail=trail.filter(p=>p.life<p.maxLife);
  trail.forEach(p=>{
    p.life++;
    const a=(1-p.life/p.maxLife)*.6;
    const r=3*(1-p.life/p.maxLife);
    const c=p.col;
    ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();
  });

  /* warp lines */
  warpLines=warpLines.filter(l=>l.life<l.maxLife);
  warpLines.forEach(l=>{
    l.life++;
    const prog=l.life/l.maxLife;
    const a=l.alpha*(1-prog);
    const x2=l.x+Math.cos(l.ang)*l.len*prog;
    const y2=l.y+Math.sin(l.ang)*l.len*prog;
    if(!safe(l.x,l.y,x2,y2)) return;
    const c=l.col;
    ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
    ctx.lineWidth=1+prog*.5;
    ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(x2,y2); ctx.stroke();
  });

  /* stars */
  const PUSH=100, PULL=160;
  stars.forEach(s=>{
    s.x+=s.vx; s.y+=s.vy;
    if(s.x<0)s.x=W; if(s.x>W)s.x=0;
    if(s.y<0)s.y=H; if(s.y>H)s.y=0;

    const dx=s.x-mouse.x, dy=s.y-mouse.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>0&&dist<PUSH){
      /* repel on hover, attract on drag */
      const dir=mouse.down?-1:1;
      const f=(1-dist/PUSH)*2.2*dir;
      s.ox+=(dx/dist)*f; s.oy+=(dy/dist)*f;
    }
    /* subtle global drift toward mouse */
    if(dist>PUSH&&dist<PULL){
      const f=(1-dist/PULL)*.08;
      s.ox-=(dx/dist)*f; s.oy-=(dy/dist)*f;
    }
    s.ox*=.87; s.oy*=.87;

    const rx=s.x+s.ox, ry=s.y+s.oy;
    s._rx=rx; s._ry=ry;

    s.tp+=s.ts;
    const tw=.5+Math.sin(s.tp)*.5;
    const a=s.alpha*(.45+tw*.55);
    const c=s.col;

    if(s.pulse&&s.r>0&&safe(rx,ry)){
      try{
        const gr=s.r*7;
        const g=ctx.createRadialGradient(rx,ry,0,rx,ry,gr);
        g.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(a*.95)+')');
        g.addColorStop(.35,'rgba('+c[0]+','+c[1]+','+c[2]+','+(a*.18)+')');
        g.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(rx,ry,gr,0,Math.PI*2); ctx.fill();
      }catch(e){}
    }
    ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
    ctx.beginPath(); ctx.arc(rx,ry,s.r,0,Math.PI*2); ctx.fill();
  });

  /* constellation lines — proximity + mouse warp */
  ctx.lineWidth=.5;
  const LD=155;
  for(let i=0;i<stars.length;i++){
    for(let j=i+1;j<stars.length;j++){
      const a=stars[i],b=stars[j];
      const dx=a._rx-b._rx, dy=a._ry-b._ry;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<LD&&d>0){
        /* lines near mouse glow brighter */
        const mdx=(a._rx+b._rx)*.5-mouse.x;
        const mdy=(a._ry+b._ry)*.5-mouse.y;
        const md=Math.sqrt(mdx*mdx+mdy*mdy);
        const boost=md<120?1+(1-md/120)*1.8:1;
        const alpha=(1-d/LD)*.16*boost;
        try{
          const lg=ctx.createLinearGradient(a._rx,a._ry,b._rx,b._ry);
          lg.addColorStop(0,'rgba('+a.col[0]+','+a.col[1]+','+a.col[2]+','+alpha+')');
          lg.addColorStop(1,'rgba('+b.col[0]+','+b.col[1]+','+b.col[2]+','+alpha+')');
          ctx.strokeStyle=lg;
          ctx.beginPath(); ctx.moveTo(a._rx,a._ry); ctx.lineTo(b._rx,b._ry); ctx.stroke();
        }catch(e){}
      }
    }
  }

  /* ripples */
  ripples=ripples.filter(r=>r.alpha>.01);
  ripples.forEach(r=>{
    r.r+=r.speed; r.alpha*=.88;
    const c=r.col;
    ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+r.alpha+')';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke();
  });

  /* shockwaves */
  shockwaves=shockwaves.filter(s=>s.alpha>.01);
  shockwaves.forEach(s=>{
    s.r+=s.speed; s.alpha*=.92;
    ctx.strokeStyle='rgba(200,255,0,'+s.alpha+')';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.stroke();
    /* inner ring */
    if(s.r>40){
      ctx.strokeStyle='rgba(124,92,252,'+(s.alpha*.5)+')';
      ctx.lineWidth=.8;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r*.7,0,Math.PI*2); ctx.stroke();
    }
  });

  /* nova particles */
  novas=novas.filter(n=>n.life<n.maxLife);
  novas.forEach(n=>{
    n.life++;
    n.x+=n.vx; n.y+=n.vy;
    n.vx*=.97; n.vy*=.97;
    const prog=n.life/n.maxLife;
    const a=(1-prog)*.8;
    const c=n.col;
    ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r*(1-prog*.5),0,Math.PI*2); ctx.fill();
  });

  /* meteors */
  meteorTimer++;
  if(meteorTimer>240&&!meteors.length||meteorTimer>320){
    if(Math.random()<.018){spawnMeteor(false); meteorTimer=0;}
  }
  meteors=meteors.filter(m=>m.life<m.maxLife&&m.y<H+30);
  meteors.forEach(m=>{
    m.life++;
    const prog=m.life/m.maxLife;
    const alpha=prog<.15?prog/.15:1-(prog-.15)/.85;
    const tx=m.x-m.vx*(m.len/Math.max(m.vy,.01));
    const ty=m.y-m.len;
    if(!safe(m.x,m.y,tx,ty)) return;
    const c=m.col;
    try{
      const tail=ctx.createLinearGradient(m.x,m.y,tx,ty);
      tail.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha*.95)+')');
      tail.addColorStop(.3,'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha*.35)+')');
      tail.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
      ctx.strokeStyle=tail; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();
      /* head glow */
      const g2=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,5);
      g2.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha*.9)+')');
      g2.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
      ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(m.x,m.y,5,0,Math.PI*2); ctx.fill();
    }catch(e){}
    m.x+=m.vx; m.y+=m.vy;
  });
}

/* ── EVENTS ── */
function getPos(e){
  const r=cv.getBoundingClientRect();
  if(e.touches) return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
cv.addEventListener('mousemove',e=>{const p=getPos(e);mouse.x=p.x;mouse.y=p.y;});
cv.addEventListener('mouseleave',()=>{mouse.x=-9999;mouse.y=-9999;mouse.vx=0;mouse.vy=0;});
cv.addEventListener('mousedown',e=>{mouse.down=true;const p=getPos(e);addRipple(p.x,p.y,ACCENT,false);});
cv.addEventListener('mouseup',()=>{mouse.down=false;});
cv.addEventListener('click',e=>{
  const p=getPos(e);
  addRipple(p.x,p.y,Math.random()>.5?ACCENT:CYAN,false);
  /* fling nearby stars */
  stars.forEach(s=>{
    const dx=s.x-p.x,dy=s.y-p.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<80&&d>0){const f=(1-d/80)*5;s.ox+=(dx/d)*f;s.oy+=(dy/d)*f;}
  });
});
cv.addEventListener('dblclick',e=>{
  const p=getPos(e);
  addRipple(p.x,p.y,PURPLE,true);
  spawnMeteor(true);
});
cv.addEventListener('touchmove',e=>{e.preventDefault();const p=getPos(e);mouse.x=p.x;mouse.y=p.y;},{passive:false});
cv.addEventListener('touchstart',e=>{const p=getPos(e);mouse.down=true;addRipple(p.x,p.y,ACCENT,false);});
cv.addEventListener('touchend',()=>{mouse.down=false;mouse.x=-9999;mouse.y=-9999;});

window.addEventListener('resize',()=>{
  resize();
  stars.forEach(s=>{s.x=Math.random()*W;s.y=Math.random()*H;});
  orbs.forEach((o,i)=>{if(o.x>W)o.x=Math.random()*W;if(o.y>H)o.y=Math.random()*H;});
});

init();
draw();
})();
</script>
